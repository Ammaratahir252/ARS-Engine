<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — ARS Engine</title>
<meta name="description" content="Log in to your ARS Engine account and access your acquisition intelligence pipeline.">
<link rel="stylesheet" href="shared.css">
</head>
<body>

<div class="auth-bg">
  <div class="auth-card">
    <div class="auth-logo">
      <div style="width:36px;height:36px;background:var(--amber);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;color:var(--navy);position:relative;overflow:hidden">
        <span style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent)"></span>ARS
      </div>
      <div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--ink);line-height:1">ARS Engine</div>
        <div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink4);font-family:'JetBrains Mono',monospace">Acquisition Intelligence</div>
      </div>
    </div>

    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Log in to your acquisition intelligence pipeline.</div>

    <button class="oauth-btn" onclick="ARS.toast('Google OAuth coming soon','ok')">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
    <button class="oauth-btn" onclick="ARS.toast('Microsoft OAuth coming soon','ok')">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#f25022" d="M1 1h10v10H1z"/><path fill="#7fba00" d="M13 1h10v10H13z"/><path fill="#00a4ef" d="M1 13h10v10H1z"/><path fill="#ffb900" d="M13 13h10v10H13z"/></svg>
      Continue with Microsoft
    </button>

    <div class="auth-divider">or continue with email</div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" class="form-control" placeholder="you@firm.com" id="login-email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" class="form-control" placeholder="••••••••••" id="login-pass">
      <div class="form-hint" style="text-align:right;margin-top:6px"><a href="#" style="color:var(--amber);font-size:11px;font-weight:600">Forgot password?</a></div>
    </div>

    <button class="btn btn-amber" style="width:100%;justify-content:center;padding:12px" onclick="handleLogin()">
      Log In to Dashboard &#8594;
    </button>

    <div class="auth-footer-text">
      Don't have an account? <a href="signup.html">Start free &#8594;</a>
    </div>

    <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border);text-align:center">
      <a href="index.html" style="font-size:11px;color:var(--ink4);display:inline-flex;align-items:center;gap:5px">
        &#8592; Back to ARS Engine
      </a>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!email || !pass) {
    ARS.toast('Please enter your email and password.', 'err');
    return;
  }
  ARS.toast('Logging in…');
  setTimeout(() => {
    // Redirect to dashboard (index.html for now)
    window.location.href = 'index.html';
  }, 1200);
}

// Allow Enter key to submit
document.addEventListener('DOMContentLoaded', () => {
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
});
</script>
</body>
</html>
